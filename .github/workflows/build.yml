# Builds Stopwatch.exe on every push and pull request and keeps it as a downloadable artifact.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Stopwatch.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Check version
        shell: pwsh
        run: |
          $v = (Get-Item .\Stopwatch.exe).VersionInfo.ProductVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              # the tag (v1.2) must match AssemblyVersion (1.2.0.0) so the release ships what it says
              $t = [version]$env:GITHUB_REF_NAME.TrimStart('v')
              $p = [version]$v
              if ($t.Major -ne $p.Major -or $t.Minor -ne $p.Minor -or
                  [Math]::Max($t.Build, 0) -ne $p.Build -or [Math]::Max($t.Revision, 0) -ne $p.Revision) {
                  throw "Tag $env:GITHUB_REF_NAME does not match AssemblyVersion $v"
              }
          }
          $hash = (Get-FileHash .\Stopwatch.exe -Algorithm SHA256).Hash
          "Stopwatch.exe $v SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Stopwatch
          path: Stopwatch.exe
          if-no-files-found: error
